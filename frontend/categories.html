<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catégories</title>
<meta name="description" content="Toutes les catégories de produits : hijama, massage, huiles et accessoires bien-être.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Aller au contenu</a>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream" style="padding-bottom: var(--space-4)">
    <div class="container">
      <p class="breadcrumb"><a href="/">Accueil</a> / Catégories</p>
      <div class="section-head">
        <h1>Catégories</h1>
        <p>Explorez notre boutique par univers de produits.</p>
      </div>
    </div>
  </section>

  <section class="section-cream" style="padding-top:0">
    <div class="container">
      <div class="grid grid-cats" id="categories-grid">
        <p>Chargement des catégories…</p>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="whatsapp"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script>
document.addEventListener('config:ready', async () => {
  const grid = document.getElementById('categories-grid');
  try {
    const categories = await Api.get('/api/categories');
    grid.innerHTML = categories.map(renderCategoryCard).join('') + renderNouveautesCard();
  } catch (err) {
    grid.innerHTML = '<p>Impossible de charger les catégories pour le moment.</p>';
  }
});
</script>
</body>
</html>
