<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Aller au contenu</a>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream" style="padding-bottom: var(--space-4)">
    <div class="container">
      <p class="breadcrumb"><a href="/" data-i18n="nav.home">Accueil</a> / <span data-i18n="nav.categories">Catégories</span></p>
      <div class="section-head">
        <h1 data-i18n="categories.title">الفئات</h1>
        <p data-i18n="categories.subtitle">تصفح البوتيك ديالنا حسب فئة المنتوجات.</p>
      </div>
    </div>
  </section>

  <section class="section-cream" style="padding-top:0">
    <div class="container">
      <div class="grid grid-cats" id="categories-grid">
        <p data-i18n="common.loadingCategories">كيتحمّل...</p>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="whatsapp"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script src="/js/tiktok-pixel.js"></script>
<script>
document.addEventListener('config:ready', async () => {
  const grid = document.getElementById('categories-grid');
  try {
    const categories = await Api.get('/api/categories');
    grid.innerHTML = categories.map(renderCategoryCard).join('') + renderNouveautesCard();
  } catch (err) {
    grid.innerHTML = `<p>${I18N.t('categories.loadError', 'Impossible de charger les catégories pour le moment.')}</p>`;
  }
});
</script>
</body>
</html>
