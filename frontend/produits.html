<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">منتوجاتنا — Hijama Store</title>
<meta name="description" id="page-description" content="اكتشف جميع منتوجاتنا: كؤوس الحجامة، أجهزة المساج، أثاث ومستلزمات الكابينة. التوصيل لجميع المدن.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<style>
  .filter-bar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-6); }
  .chip-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip {
    padding: 0.5rem 1rem; border-radius: 999px; border: 1.5px solid var(--sand-deep);
    font-size: var(--fs-xs); font-weight: 700; background: var(--white); color: var(--ink-soft);
  }
  .chip[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: var(--white); }
  .search-box { margin-inline-start: auto; min-width: 220px; }
  @media (max-width: 640px) { .search-box { margin-inline-start: 0; width: 100%; } }
</style>

<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Aller au contenu</a>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream" style="padding-bottom: var(--space-4)">
    <div class="container">
      <p class="breadcrumb"><a href="/" data-i18n="nav.home">Accueil</a> / <span data-i18n="nav.products">Produits</span></p>
      <div class="section-head">
        <h1 id="page-title" data-i18n="products.title">منتوجاتنا</h1>
        <p data-i18n="products.subtitle">تصفح المجموعة ديالنا ديال منتوجات الحجامة والمساج والعناية بالجسم.</p>
      </div>
    </div>
  </section>

  <section class="section-cream" style="padding-top:0">
    <div class="container">
      <div class="filter-bar">
        <div class="chip-row" id="category-chips">
          <button class="chip" data-filter="" aria-pressed="true" data-i18n="products.all">جميع المنتوجات</button>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="قلب على منتوج…" aria-label="قلب على منتوج" data-i18n-attr="placeholder:products.searchPlaceholder,aria-label:products.searchPlaceholder">
        </div>
      </div>
      <div class="context-banner" id="hijama-context-banner" hidden>
        <p data-i18n="products.hijamaContext">راك كتصفح كؤوس ومستلزمات الحجامة.</p>
        <div class="context-links">
          <a href="/guide-tailles-ventouses" class="btn-text" data-i18n="products.sizeGuideLink">📏 دليل المقاسات</a>
          <a href="/comparer" class="btn-text" data-i18n="products.compareLink">⇄ قارن بين المنتوجات</a>
          <a href="/composez-votre-kit" class="btn-text" data-i18n="products.buildKitLink">🧺 صاوب كيت</a>
        </div>
      </div>
      <div class="grid grid-products" id="products-grid">
        <p data-i18n="common.loadingProducts">كيتحمّل...</p>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="whatsapp"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script src="/js/tiktok-pixel.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
