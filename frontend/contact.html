<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="تواصل معانا على واتساب ولا عبر الشبكات الاجتماعية لأي سؤال على المنتوجات ولا الطلب ديالك.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">

<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Aller au contenu</a>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream">
    <div class="container">
      <p class="breadcrumb"><a href="/" data-i18n="nav.home">Accueil</a> / <span data-i18n="nav.contact">Contact</span></p>
      <div class="section-head">
        <h1 data-i18n="nav.contact">تواصل معانا</h1>
        <p data-i18n="contact.subtitle">عندك سؤال على منتوج، طلب ولا التوصيل؟ كتبلنا، كنجاوبوك دغيا.</p>
      </div>

      <div class="cart-layout">
        <form id="contact-form">
          <div class="field">
            <label for="contactName" data-i18n="contact.name">الاسم</label>
            <input type="text" id="contactName" required>
          </div>
          <div class="field">
            <label for="contactMessage" data-i18n="contact.message">الرسالة ديالك</label>
            <textarea id="contactMessage" rows="4" required placeholder="السلام، عندي سؤال على..." data-i18n-attr="placeholder:contact.messagePlaceholder"></textarea>
          </div>
          <button type="submit" class="btn btn-whatsapp" data-i18n="contact.send">صيفط على واتساب</button>
          <p class="hint" data-i18n="contact.formHint">هاد الفورم كيحل واتساب بالرسالة ديالك معمرة — غير خاصك تصيفطها.</p>
        </form>

        <div class="summary-card">
          <h3 data-i18n="contact.infoTitle">المعلومات ديالنا</h3>
          <p><a href="#" id="contact-whatsapp-link" class="btn-text" target="_blank" rel="noopener" data-i18n="footer.whatsapp">كتبلنا على واتساب</a></p>
          <p id="contact-phone" style="margin-top: var(--space-2)" hidden><a href="#" id="contact-phone-link" class="btn-text"></a></p>
          <p id="contact-hours" class="hint" style="margin-top: var(--space-2)" hidden></p>
          <p id="contact-delivery" style="margin-top: var(--space-4)" data-i18n="common.deliveryAllCities">التوصيل لجميع المدن</p>
          <h3 style="margin-top: var(--space-6)" data-i18n="home.followTitle">تابعونا</h3>
          <div class="social-row" id="contact-socials"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="whatsapp"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script src="/js/tiktok-pixel.js"></script>
<script src="/js/contact.js"></script>
</body>
</html>
