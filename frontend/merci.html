<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الطلب — Hijama Store</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',

/></noscript>
<!-- End Meta Pixel Code -->
</head>
<body>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream">
    <div class="container">
      <div class="success-box" id="success-box" hidden>
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h1 data-i18n="merci.title">صيفطنا ليك الطلب، شكرا ليك!</h1>
        <p data-i18n="merci.text">توصلنا بالطلب ديالك. غادي نعيطو ليك قريب باش نأكدو التفاصيل.</p>
        <p id="order-ref" class="hint"></p>
        <div class="btn-group" style="display:flex; flex-direction:column; gap:12px; margin-top: var(--space-5)">
          <a href="#" id="merci-whatsapp" class="btn btn-whatsapp" target="_blank" rel="noopener" data-i18n="common.contactWhatsapp">تواصل معانا على واتساب</a>
          <a href="/produits" class="btn btn-outline" data-i18n="merci.continueShopping">كمل التسوق</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script src="/js/tiktok-pixel.js"></script>
<script>
document.addEventListener('config:ready', (e) => {
  const config = e.detail;
  let order = null;
  try { order = JSON.parse(sessionStorage.getItem('lastOrder') || 'null'); } catch {}

  // Accès direct à /merci sans commande réelle (lien partagé, retour arrière,
  // favori...) : on ne montre jamais une confirmation de commande fictive.
  if (!order) {
    window.location.replace('/');
    return;
  }

  document.getElementById('success-box').hidden = false;

  const ref = document.getElementById('order-ref');
  ref.textContent = `${I18N.t('merci.orderRef', 'Commande n°')}${order.id} — ${I18N.t('merci.total', 'Total')} : ${formatPrice(order.total, config.currency)}`;
  const waMessage = `${I18N.t('merci.waMessage', 'Bonjour, je viens de passer la commande n°')}${order.id} (${formatPrice(order.total, config.currency)}) ${I18N.t('merci.waMessageSuffix', 'sur le site.')}`;

  const firedKey = `purchase_tracked_${order.id}`;
  if (!sessionStorage.getItem(firedKey)) {
    if (typeof fbq === 'function') {
      fbq('track', 'Purchase', {
        value: order.total,
        currency: 'MAD',
        contents: (order.items || []).map((i) => ({ id: i.product_id, quantity: i.quantity })),
        content_type: 'product',
      }, { eventID: `purchase_${order.id}` });
    }
    if (typeof ttq !== 'undefined' && ttq && typeof ttq.track === 'function') {
      ttq.track('Purchase', {
        value: order.total,
        currency: 'MAD',
        content_type: 'product',
        contents: (order.items || []).map((i) => ({ content_id: String(i.product_id), quantity: i.quantity })),
      }, { event_id: `purchase_${order.id}` });
    }
    sessionStorage.setItem(firedKey, '1');
  }
  document.getElementById('merci-whatsapp').href = Api.whatsappLink(config.whatsappNumber, waMessage);
});
</script>
</body>
</html>
