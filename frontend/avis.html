<link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">

<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Aller au contenu</a>
<div data-include="header"></div>

<main id="main">
  <section class="section-cream" style="padding-bottom: var(--space-4)">
    <div class="container">
      <p class="breadcrumb"><a href="/" data-i18n="nav.home">Accueil</a> / <span data-i18n="nav.reviews">Avis clients</span></p>
      <div class="section-head">
        <h1 data-i18n="home.reviewsTitle">شنو كيقولو الزبناء ديالنا</h1>
        <p data-i18n="avis.subtitle">آراء الزبناء ديالنا من بعد ما توصلهم المنتوجات.</p>
      </div>
    </div>
  </section>

  <section class="section-cream" style="padding-top:0">
    <div class="container">
      <div class="grid grid-reviews" id="reviews-grid">
        <p data-i18n="avis.loading">كيتحمّل...</p>
      </div>
    </div>
  </section>

  <section class="section-sand">
    <div class="container">
      <div class="cta-band">
        <h2 data-i18n="avis.ctaTitle">بغيتي تطلب؟</h2>
        <a href="/produits" class="btn btn-primary" data-i18n="avis.ctaButton">شوف البوتيك</a>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="whatsapp"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/include.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/render.js"></script>
<script src="/js/mini-cart.js"></script>
<script src="/js/tiktok-pixel.js"></script>
<script>
document.addEventListener('config:ready', async () => {
  const grid = document.getElementById('reviews-grid');
  try {
    const reviews = await Api.get('/api/reviews');
    grid.innerHTML = reviews.length ? reviews.map(renderReviewCard).join('') : `<p>${I18N.t('avis.none', "Pas encore d'avis.")}</p>`;
  } catch (err) {
    grid.innerHTML = `<p>${I18N.t('avis.loadError', 'Impossible de charger les avis pour le moment.')}</p>`;
  }
});
</script>
</body>
</html>
