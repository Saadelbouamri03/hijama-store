<div data-include="header"></div>

<main id="main">
  <section class="section-cream" style="padding-bottom: var(--space-4)">
    <div class="container">
      <p class="breadcrumb"><a href="/" data-i18n="nav.home">Accueil</a> / <span data-i18n="kit.title">Composez votre kit</span></p>
      <div class="section-head">
        <h1 data-i18n="kit.title">صاوب الكيت ديالك</h1>
        <p data-i18n="kit.builderSubtitle">اختار الكؤوس والأدوات من المنتوجات المتوفرة فعلا، بدل الكميات، من بعد زيد كولشي للپانييه بضغطة وحدة. كل خطوة اختيارية.</p>
      </div>
    </div>
  </section>

  <section class="section-cream reveal" style="padding-top:0">
    <div class="container">
      <div class="kit-layout">
        <div>
          <div class="kit-step">
            <h2 data-i18n="kit.yourCups">الكؤوس ديالك</h2>
            <div class="kit-picker-grid" id="kit-cups-grid">
              <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
            </div>
          </div>

          <div class="kit-step">
            <div class="kit-step-head">
              <h2 data-i18n="kit.yourAccessories">الأدوات ديالك</h2>
              <select id="kit-accessory-category" aria-label="فئة الأدوات" data-i18n-attr="aria-label:kit.accessoryCategory"></select>
            </div>
            <div class="kit-picker-grid" id="kit-accessories-grid">
              <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
            </div>
          </div>
        </div>

        <aside class="kit-summary" aria-label="ملخص الكيت ديالك" data-i18n-attr="aria-label:kit.summaryAria">
          <h3 data-i18n="kit.yourKit">الكيت ديالك</h3>
          <div id="kit-summary-body">
            <p class="kit-summary-empty" data-i18n="kit.noneSelected">مازال ماخترتيش شي حاجة.</p>
          </div>
          <div id="kit-summary-foot"></div>
        </aside>
      </div>
    </div>
  </section>
